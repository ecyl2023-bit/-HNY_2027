<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Video Player</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #start-overlay {
            position: fixed; inset: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.8); color: #fff;
            font-family: sans-serif; font-size: 22px; text-align: center;
        }
        #start-overlay button {
            font-size: 20px; padding: 16px 32px; border: 0;
            border-radius: 12px; background: #fff; color: #000;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <button id="start-btn">แตะเพื่อเริ่มสแกน</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes;"
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false"
             embedded
             renderer="colorManagement: true; physicallyCorrectLights: true">

        <a-assets>
            <video id="ar-video" src="./video.mp4" loop playsinline webkit-playsinline preload="auto"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
            <!-- วิดีโอเป็นแนวตั้ง 720x1280 (9:16) จึงใช้ width 1 / height 1.778 -->
            <a-video src="#ar-video" width="1" height="1.778" position="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const scene = document.querySelector('a-scene');
            const target = document.querySelector('#target-entity');
            const video = document.querySelector('#ar-video');
            const overlay = document.querySelector('#start-overlay');
            const startBtn = document.querySelector('#start-btn');

            // ต้องให้ผู้ใช้แตะก่อน เบราว์เซอร์มือถือถึงจะยอมเล่นวิดีโอ
            startBtn.addEventListener("click", async () => {
                try {
                    await video.play();   // ปลดล็อกการเล่นวิดีโอ
                    video.pause();
                    video.currentTime = 0;
                } catch (e) {
                    console.warn("unlock video failed:", e);
                }
                overlay.style.display = "none";
                scene.systems["mindar-image-system"].start();
            });

            target.addEventListener("targetFound", () => video.play());
            target.addEventListener("targetLost", () => video.pause());
        });
    </script>
</body>
</html>
