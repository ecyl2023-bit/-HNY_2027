<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Video Player</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #sound-hint {
            display: none;
            position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
            z-index: 10; padding: 12px 20px; border-radius: 24px;
            background: rgba(0, 0, 0, 0.75); color: #fff;
            font-family: sans-serif; font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="sound-hint">🔇 แตะหน้าจอเพื่อเปิดเสียง</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;"
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">

        <a-assets>
            <video id="ar-video" src="./video.mp4" loop playsinline webkit-playsinline preload="auto"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
            <!-- วิดีโอแนวตั้ง 720x1280 (9:16) ถ้าเปลี่ยนเป็นแนวนอนให้ใช้ height 0.56 -->
            <a-video src="#ar-video" width="1" height="1.778" position="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const target = document.querySelector('#target-entity');
            const video = document.querySelector('#ar-video');
            const hint = document.querySelector('#sound-hint');

            // พยายามเล่นแบบมีเสียงก่อน ถ้าเบราว์เซอร์บล็อก ให้เล่นแบบปิดเสียงแทน
            async function playVideo() {
                video.muted = false;
                try {
                    await video.play();
                    hint.style.display = "none";
                } catch (e) {
                    video.muted = true;
                    try {
                        await video.play();
                        hint.style.display = "block";
                    } catch (e2) {
                        console.warn("play failed:", e2);
                    }
                }
            }

            target.addEventListener("targetFound", playVideo);
            target.addEventListener("targetLost", () => video.pause());

            // แตะหน้าจอครั้งแรก = เปิดเสียง
            document.addEventListener("click", () => {
                if (video.muted) {
                    video.muted = false;
                    hint.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
