<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Video Player</title>
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;" 
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <!-- เรียกใช้ไฟล์วิดีโอชื่อ video.mp4 -->
            <video id="ar-video" src="./video.mp4" response-type="arraybuffer" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
        </a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
            <a-video src="#ar-video" width="1" height="0.56" position="0 0 0"></a-video>
        
    </a-scene>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const targetEntity = document.querySelector('#target-entity');
            const video = document.querySelector('#ar-video');
            targetEntity.addEventListener("targetFound", () => { video.play(); });
            targetEntity.addEventListener("targetLost", () => { video.pause(); });
        });
    </script>
</body>
</html>
